{% load i18n %}

<section class="devproject__roadmap">
    <h2>{% trans "Roadmap" %}</h2>
    <ul class="roadmap">
        {% for item in page.roadmap.all %}
            <li class="roadmap__item roadmap__item--{{ item.state }}">
                <span class="roadmap__state">{{ item.get_state_display }}</span>
                <span class="roadmap__title">{{ item.title }}</span>
            </li>
        {% endfor %}
    </ul>
</section>
