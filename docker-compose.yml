volumes:
  postgres18_data:
    driver: local
    driver_opts:
      type: none
      device: ./data/postgres18_data
      o: bind  

# Shared with the core stack, so pgadmin can reach this database without any
# port being published on the host, and web can reach Keycloak. Created by
# semprini-core.
networks:
  internal:
    name: semprini_internal
    external: true

services:
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./data/static:/home/app/static
      - ./data/media:/home/app/media
    expose:
      - 8000
    # Bound to docker0, not 0.0.0.0 — Traefik reaches this via
    # host.docker.internal; nothing outside the host needs it.
    ports:
      - "172.17.0.1:8000:8000"
    env_file:
      - ./.env.prod
    depends_on:
      - db
    # The OIDC token exchange calls auth.semprini.me, which semprini-core's
    # split-horizon DNS resolves to Traefik on semprini_internal. Off that network
    # the call hangs until gunicorn kills the worker and /oidc/callback/ returns 500.
    networks:
      - default
      - internal

  # Drains the narration render queue. Runs the same image as web, but it is
  # the only process that ever holds ELEVEN_LABS_API_KEY: an internet-facing
  # gunicorn has no reason to hold a billable credential.
  narrator:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python manage.py render_narrations --loop --interval 30
    volumes:
      - ./data/media:/home/app/media
    env_file:
      - ./.env.prod
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      # postgres:18 uses PGDATA=/var/lib/postgresql/18/docker under the
      # /var/lib/postgresql volume, so mount the bind volume at that root.
      - postgres18_data:/var/lib/postgresql
      # Auto-restore the most recent dump on first init (only runs when the
      # data dir is empty). The entrypoint gunzips and applies *.sql.gz.
      - ./data/backup/recovered_migrated_2026-09-03T07-23-18Z.sql.gz:/docker-entrypoint-initdb.d/restore.sql.gz:ro
    env_file:
      - ./.env.prod.db
    networks:
      - default
      - internal

  # backupdb only dumps the DB to S3 on a cron; it exits immediately without
  # S3 creds, so it is disabled for local runs. Re-enable and add S3_* vars to
  # .env.prod.db (S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, S3_PATH, BACKUP_SCHEDULE,
  # POSTGRES_HOST=db) if you need scheduled backups.
  # backupdb:
  #   build:
  #     context: ./backupdb
  #     dockerfile: Dockerfile
  #   restart: unless-stopped
  #   env_file:
  #     - ./.env.prod.db
  #   depends_on:
  #     - db

  
